name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Jars
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission and Fix Line Endings
        run: |
          chmod +x gradlew
          sed -i 's/\r$//' gradlew

      - name: Build with Gradle
        run: ./gradlew shadowJar --no-daemon --stacktrace

      - name: Upload Paper Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: peyajCustomDisc-Paper
          path: paper/build/libs/peyajCustomDisc-Paper-*.jar
          if-no-files-found: error

      - name: Upload Fabric 1.21 Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: peyajCustomDisc-Fabric-1.21
          path: fabric-1.21/build/libs/peyajCustomDisc-Fabric-1.21-*.jar
          if-no-files-found: error

      - name: Upload Fabric 26.3 Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: peyajCustomDisc-Fabric-26
          path: fabric-26/build/libs/peyajCustomDisc-Fabric-26-*.jar
          if-no-files-found: error

      - name: Notify Discord on Success
        if: success() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -n 1 | sed 's/"/\\"/g')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

          PAYLOAD=$(cat <<EOF
          {
            "username": "peyajCustomDisc CI",
            "avatar_url": "https://raw.githubusercontent.com/realpeyaj/peyajCustomDisc/main/peyajcustomdisc.png",
            "embeds": [
              {
                "title": "Build Successful: ${{ github.repository }}",
                "url": "$RUN_URL",
                "color": 3066993,
                "description": "Artifacts are ready for download.",
                "fields": [
                  {
                    "name": "Branch",
                    "value": "\`${{ github.ref_name }}\`",
                    "inline": true
                  },
                  {
                    "name": "Author",
                    "value": "${{ github.actor }}",
                    "inline": true
                  },
                  {
                    "name": "Commit",
                    "value": "[\`${{ github.sha }}\`]($COMMIT_URL)\n$COMMIT_MSG",
                    "inline": false
                  },
                  {
                    "name": "Built Jars",
                    "value": "- peyajCustomDisc-Paper\n- peyajCustomDisc-Fabric-1.21\n- peyajCustomDisc-Fabric-26",
                    "inline": false
                  }
                ],
                "footer": {
                  "text": "Click the embed title to download the jar artifacts"
                }
              }
            ]
          }
          EOF
          )

          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"

      - name: Notify Discord on Failure
        if: failure() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -n 1 | sed 's/"/\\"/g')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

          PAYLOAD=$(cat <<EOF
          {
            "username": "peyajCustomDisc CI",
            "avatar_url": "https://raw.githubusercontent.com/realpeyaj/peyajCustomDisc/main/peyajcustomdisc.png",
            "embeds": [
              {
                "title": "Build Failed: ${{ github.repository }}",
                "url": "$RUN_URL",
                "color": 15158332,
                "description": "Compilation or assembly failed.",
                "fields": [
                  {
                    "name": "Branch",
                    "value": "\`${{ github.ref_name }}\`",
                    "inline": true
                  },
                  {
                    "name": "Author",
                    "value": "${{ github.actor }}",
                    "inline": true
                  },
                  {
                    "name": "Commit",
                    "value": "[\`${{ github.sha }}\`]($COMMIT_URL)\n$COMMIT_MSG",
                    "inline": false
                  }
                ],
                "footer": {
                  "text": "Check GitHub Actions logs for full stacktrace"
                }
              }
            ]
          }
          EOF
          )

          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"
