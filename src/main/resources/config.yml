# peyajCustomDisc Configuration

# The port for the web interface (Disc Creator).
# Default: 8080
# ensure this port is open/allocated on your hosting panel.
web-port: 8080

# Security Admin Password for direct browser login to Disc Creator.
# Set to a strong password to prevent unauthorized web access.
# when someones tried to access the ip without using /disc web, they will be asked to enter this password
admin-password: "changeme"

# The Public URL of this plugin's web server.
# Used to send the resource pack to players.
# Example: "http://143.2.1.5:8080" or "https://discs.myserver.com"
public-url: "http://localhost:8080"

# Should the plugin automatically push the resource pack in real-time to online players when a disc is added/removed?
auto-update-pack: true

# ========================================
# Java Resource Pack Delivery Settings
# ========================================
resource-pack:
  # Whether to automatically send the resource pack to Java players when they join the server.
  send-on-join: true
  # Whether this pack should replace ALL existing server resource packs on the player's client.
  # Set to 'false' (Recommended) to allow this pack to stack cleanly alongside your server.properties pack or ItemsAdder/Oraxen!
  # Set to 'true' ONLY if you want this pack to wipe/override all other server packs.
  replace-existing: false
  # Whether the resource pack prompt is mandatory to accept to play.
  required: false
  # Optional custom prompt message shown when asking the player to download the pack (supports MiniMessage formatting, e.g. "<gold>Custom Disc Pack</gold>").
  # Leave empty ("") for default vanilla prompt.
  prompt: ""

# Should we automatically run "geyser reload" after updating the Bedrock pack?
# WARNING: This may cause temporary lag or disconnect some Bedrock players.
# Set to 'true' if you want immediate updates, or 'false' to require manual restarts/reloads.
auto-reload-geyser: true

# Proxy / HAProxy Support
# Set to 'true' if you are running this plugin behind a proxy (like HAProxy) that sends the PROXY protocol.
# WARNING: If enabled, you CANNOT connect directly to the port with a browser (it will fail).
# You MUST connect through your proxy.
haproxy-support: false

# ========================================
# WorldGuard Region Music (Optional)
# ========================================
# Map WorldGuard regions to custom disc IDs.
# When a player enters a region, the mapped disc will automatically play.
# When they leave, the music stops.
# 
# Format:
#   region-music:
#     region_name_lowercase: "disc_id"
#
# Example:
#   region-music:
#     spawn: "background_ambient"
#     pvp_arena: "battle_music"
#     lobby: "chill_vibes"
#
# Note: Region names are case-insensitive (converted to lowercase).
# The disc_id must match exactly with a created disc.

region-music:
  # example_region: "example_disc_id"

# ========================================
# Jukebox Music Settings
# ========================================
jukebox:
  # Default volume of the music (0.0 to 1.0)
  volume: 1.0
  # Default pitch of the music
  pitch: 1.0
  # The sound source category for custom discs.
  # Options: MASTER, MUSIC, RECORDS, WEATHER, BLOCKS, HOSTILE, NEUTRAL, PLAYERS, AMBIENT, VOICE
  sound-category: "RECORDS"
  # Range radius (in blocks) for Now Playing action-bar alerts and sound propagation
  range: 64.0
  # Enable continuous green musical note particles while custom music plays in jukeboxes
  enable-particles: true
  # Particle type/style. Options: NOTE, HEART, FLAME, CLOUD, SCULK_SOUL, etc.
  # Use "MATCH" to automatically choose particles based on disc style.
  particle-type: "MATCH"

# ========================================
# Catalog Settings
# ========================================
catalog:
  # Duration in seconds for preview playback when middle-clicked or right-clicked in catalog GUI
  preview-duration: 15

